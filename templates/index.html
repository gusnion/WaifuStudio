<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAIFU</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <h1>WAIFU</h1>
    <nav class="tabs">
      <button id="tab-image" class="tab active" type="button">Imagen</button>
      <button id="tab-video" class="tab" type="button">Video</button>
    </nav>
    <button id="btn-oc" class="oc-button" type="button">OC Maker</button>
  </header>

  <main>
    <section id="panel-image" class="panel active">
      <aside class="controls">
        <label class="field">
          <span>Prompt</span>
          <textarea id="prompt" rows="5" placeholder="1girl, smile, ..."></textarea>
        </label>
        <div class="enhance-row">
          <button id="btn-enhance" type="button">Mejorar prompt</button>
          <label class="inline-field">
            <span>Fuerza</span>
            <select id="enhance-strength">
              <option value="fiel">Fiel</option>
              <option value="balanceado" selected>Balanceado</option>
              <option value="creativo">Creativo</option>
            </select>
          </label>
        </div>
        <div id="enhance-result" class="enhance-result hidden">
          <div class="enhance-block">
            <span class="enhance-label">Positivo propuesto</span>
            <p id="enhance-positive"></p>
          </div>
          <div class="enhance-block">
            <span class="enhance-label">Negativo propuesto</span>
            <p id="enhance-negative"></p>
          </div>
          <div class="enhance-actions">
            <button id="btn-enhance-use" class="primary" type="button">Usar</button>
            <button id="btn-enhance-discard" type="button">Descartar</button>
          </div>
        </div>

        <label class="field">
          <span>Rating</span>
          <select id="rating">
            <option value="sfw">sfw</option>
            <option value="nsfw">nsfw</option>
          </select>
        </label>
        <label class="field">
          <span>Preprompt</span>
          <select id="preprompt"></select>
        </label>
        <label class="field">
          <span>Modelo</span>
          <select id="model"></select>
        </label>

        <label class="field">
          <span>Tamaño</span>
          <select id="size"></select>
        </label>
        <div id="manual-size" class="grid-2 hidden">
          <label class="field"><span>Ancho</span><input id="width" type="number" value="768" step="8" min="64" max="4096"></label>
          <label class="field"><span>Alto</span><input id="height" type="number" value="1344" step="8" min="64" max="4096"></label>
        </div>

        <div class="grid-2">
          <label class="field"><span>Seed</span><input id="seed" type="number" value="42"></label>
          <label class="field"><span>Pasos</span><input id="steps" type="number" value="20" min="1"></label>
          <label class="field"><span>CFG</span><input id="cfg" type="number" value="4.0" step="0.1"></label>
          <label class="field"><span>Sampler</span><select id="sampler"></select></label>
          <label class="field"><span>Scheduler</span><select id="scheduler"></select></label>
        </div>

        <label class="field">
          <span>Negativo</span>
          <textarea id="negative" rows="3" placeholder="worst quality, low quality, ..."></textarea>
        </label>
        <button id="btn-negative-restore" type="button">Restaurar</button>

        <label class="field">
          <span>Imagen de referencia (PNG)</span>
          <input id="ref-image" type="file" accept="image/png">
        </label>
        <div id="ref-preview" class="ref-preview hidden">
          <img id="ref-thumb" alt="Referencia seleccionada">
          <button id="btn-ref-clear" type="button">Quitar</button>
        </div>
        <label class="field">
          <span>Fuerza <output id="strength-value">0.60</output></span>
          <input id="strength" type="range" min="0.05" max="1" step="0.05" value="0.6">
        </label>

        <button id="btn-generate" class="primary" type="button">Generar</button>
        <p id="job-status" class="status">Listo</p>
      </aside>

      <section class="gallery-panel">
        <div class="gallery-header">
          <h2>Galería</h2>
          <button id="btn-reload" type="button">Recargar</button>
        </div>
        <div id="gallery" class="gallery"></div>
        <div class="pager">
          <button id="gallery-prev" type="button">‹ Anterior</button>
          <span id="gallery-page">página 1 de 1</span>
          <button id="gallery-next" type="button">Siguiente ›</button>
        </div>
      </section>
    </section>

    <section id="panel-video" class="panel">
      <aside class="controls">
        <label class="field">
          <span>Motor</span>
          <select id="video-engine">
            <option value="wan">Wan 2.2 I2V · 81 frames · 16 fps</option>
            <option value="h3">MiniMax H3 FL2VA · 8 s · 24 fps</option>
          </select>
        </label>

        <label class="field">
          <span>Imagen fuente (PNG)</span>
          <input id="video-image" type="file" accept="image/png">
        </label>
        <label class="field" id="video-last-field" style="display: none">
          <span>Último frame (PNG, solo H3)</span>
          <input id="video-last-image" type="file" accept="image/png">
        </label>

        <label class="field">
          <span>Movimiento (lenguaje natural)</span>
          <textarea id="video-motion" rows="4" placeholder="Describe qué debe pasar en el video..."></textarea>
        </label>
        <div class="grid-2">
          <label class="field">
            <span>Rating</span>
            <select id="video-rating">
              <option value="nsfw">nsfw</option>
              <option value="sfw">sfw</option>
            </select>
          </label>
          <label class="field">
            <span>&nbsp;</span>
            <button id="btn-motion" type="button">Generar motion</button>
          </label>
        </div>

        <label class="field" id="video-motion-positive-field">
          <span>Motion positivo (EN, Wan)</span>
          <textarea id="video-motion-positive" rows="3" placeholder="English motion prompt..."></textarea>
        </label>
        <label class="field" id="video-prompt-field" style="display: none">
          <span>Prompt H3 (FL2VA)</span>
          <textarea id="video-prompt" rows="3" placeholder="integrated_multimodal_description: ..."></textarea>
        </label>

        <div class="grid-2">
          <label class="field" id="video-aspect-field">
            <span>Aspecto (Wan)</span>
            <select id="video-aspect">
              <option value="vertical">Vertical 432×768</option>
              <option value="horizontal">Horizontal 768×432</option>
            </select>
          </label>
          <label class="field">
            <span>Seed</span>
            <input id="video-seed" type="number" value="42">
          </label>
        </div>

        <button id="btn-video-generate" class="primary" type="button">Generar video</button>
        <p id="video-status" class="status">Listo</p>
      </aside>

      <section class="gallery-panel">
        <div class="gallery-header">
          <h2>Galería de video</h2>
          <button id="btn-video-reload" type="button">Recargar</button>
        </div>
        <div id="video-gallery" class="gallery"></div>
        <div class="pager">
          <button id="video-gallery-prev" type="button">‹ Anterior</button>
          <span id="video-gallery-page">página 1 de 1</span>
          <button id="video-gallery-next" type="button">Siguiente ›</button>
        </div>
      </section>
    </section>
  </main>

  <div id="oc-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>OC Maker</h2>
        <button id="btn-oc-close" type="button">Cerrar</button>
      </div>
      <div id="oc-groups" class="oc-groups"></div>
      <div class="modal-footer">
        <button id="btn-oc-add" class="primary" type="button">Añadir al prompt</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button id="btn-lightbox-close" class="lightbox-close" type="button" aria-label="Cerrar">×</button>
    <img id="lightbox-img" alt="">
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
